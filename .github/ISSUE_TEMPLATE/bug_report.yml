name: Bug report
description: Report a reproducible platform defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include minimal steps and relevant logs with personal data removed. }
    validations: { required: true }
  - type: dropdown
    id: service
    attributes: { label: Area, options: [Identity service, Media service, Web application, Infrastructure, Documentation] }
    validations: { required: true }
  - type: textarea
    id: environment
    attributes: { label: Environment, description: Runtime versions, operating system, and commit SHA. }
