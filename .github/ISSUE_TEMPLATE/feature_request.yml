name: Feature request
description: Propose an outcome for the platform
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Describe the user or business problem. }
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes: { label: Desired outcome, description: Describe success without prescribing implementation. }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I identified whether this changes personal-data collection, processing, retention, or sharing.
          required: true
