x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.6-alpine
    cpus: 1.0
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tamo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tamo_local}
      POSTGRES_DB: postgres
      IDENTITY_DB: ${IDENTITY_DB:-tamo_identity}
      MEDIA_DB: ${MEDIA_DB:-tamo_media}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-tamo_identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local_only}
      MEDIA_DB_USER: ${MEDIA_DB_USER:-tamo_media}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:-media_local_only}
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [tamo]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  redis:
    image: redis:7.4.5-alpine
    cpus: 0.5
    mem_limit: 256m
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    networks: [tamo]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:3.9.1
    cpus: 1.5
    mem_limit: 1536m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["9092:9092"]
    networks: [tamo]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    cpus: 1.0
    mem_limit: 768m
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tamo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tamo_minio_local}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    networks: [tamo]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/bootstrap/create-topics.sh"]
    volumes:
      - ./kafka:/bootstrap:ro
    networks: [tamo]
    restart: "no"
    logging: *default-logging
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tamo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tamo_minio_local}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-tamo-media}
    entrypoint: ["/bin/sh", "/bootstrap/create-bucket.sh"]
    volumes:
      - ./minio:/bootstrap:ro
    networks: [tamo]
    restart: "no"
    logging: *default-logging
  loki:
    image: grafana/loki:3.5.5
    profiles: [observability]
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports: ["3100:3100"]
    networks: [tamo]
    restart: unless-stopped
    logging: *default-logging
  alloy:
    image: grafana/alloy:v1.10.2
    profiles: [observability]
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on: [loki]
    networks: [tamo]
    restart: unless-stopped
    logging: *default-logging
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-observability-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [loki]
    networks: [tamo]
    restart: unless-stopped
    logging: *default-logging
volumes:
  postgres_data:
  redis_data:
  minio_data:
  loki_data:
  alloy_data:
  grafana_data:
networks:
  tamo:
    name: tamo-local
